name: BUILD 71 parse diagnostics

on:
  pull_request:
    branches:
      - windows-godot-4.7.1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-71-parse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_LINUX_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"

jobs:
  inspect-latest-build70-failure:
    name: Inspect latest BUILD 70 failure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print failed job and log tail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "smwr-build71-diagnostics",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/runs"
              "?branch=windows-godot-4.7.1&status=failure&per_page=30"
          )
          runs = get_json(runs_url).get("workflow_runs", [])
          target = next(
              (
                  run
                  for run in runs
                  if run.get("name") == "BUILD 70 - PC and Android - Godot 4.7.1"
              ),
              None,
          )
          if target is None:
              print("No failed BUILD 70 run was found.")
              raise SystemExit(0)

          print(
              "FAILED RUN",
              target.get("id"),
              target.get("head_sha"),
              target.get("event"),
              target.get("html_url"),
          )
          jobs = get_json(target["jobs_url"]).get("jobs", [])
          failed_jobs = [job for job in jobs if job.get("conclusion") == "failure"]
          for job in jobs:
              print("JOB", job.get("id"), job.get("name"), job.get("conclusion"))
              for step in job.get("steps", []):
                  print(
                      "  STEP",
                      step.get("number"),
                      step.get("name"),
                      step.get("conclusion"),
                  )

          for job in failed_jobs:
              log_url = f"https://api.github.com/repos/{repo}/actions/jobs/{job['id']}/logs"
              request = urllib.request.Request(log_url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  text = response.read().decode("utf-8", errors="replace")
              lines = text.splitlines()
              print(f"\n===== LOG TAIL: {job.get('name')} ({job['id']}) =====")
              print("\n".join(lines[-500:]))
          PY

  windows-parse:
    name: Windows prepare and parse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl python3 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "$GODOT_LINUX_URL"
          rm -rf /tmp/godot-bin
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Prepare Windows
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_windows.py
          python3 tools/prepare_common_ui.py

      - name: Import and parse Windows
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/windows-parse.log

      - name: Upload Windows parse log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-71-windows-parse-log
          path: /tmp/windows-parse.log
          if-no-files-found: ignore
          retention-days: 3

  android-parse:
    name: Android prepare and parse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl python3 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "$GODOT_LINUX_URL"
          rm -rf /tmp/godot-bin
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_android_mobile_68.py
          python3 tools/prepare_common_ui.py

      - name: Import and parse Android project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/android-parse.log

      - name: Upload Android parse log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-71-android-parse-log
          path: /tmp/android-parse.log
          if-no-files-found: ignore
          retention-days: 3
