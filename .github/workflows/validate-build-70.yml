name: Validate BUILD 70 - Godot 4.7.1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"

jobs:
  windows:
    name: Windows x64 Godot 4.7.1
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout BUILD 70 source
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Prepare Windows project
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates zip
          rm -rf /var/lib/apt/lists/*

          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          python3 tools/prepare_windows.py
          python3 tools/prepare_common_ui.py
          godot --headless --path . --import 2>&1 | tee /tmp/windows-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/windows-import.log; then
            cat /tmp/windows-import.log >&2
            exit 1
          fi

      - name: Export Windows x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --verbose --path . \
            --export-release "Windows Desktop" \
            build/windows/SuperMarioWorldRemasteredPlus.exe
          test -s build/windows/SuperMarioWorldRemasteredPlus.exe
          test -s build/windows/SuperMarioWorldRemasteredPlus.pck
          cd build/windows
          zip -9 -r ../SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-70.zip .

      - name: Upload Windows BUILD 70
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-windows-x64-build-70
          path: build/SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-70.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64 Godot 4.7.1
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout BUILD 70 source
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates zip openjdk-17-jdk-headless
          rm -rf /var/lib/apt/lists/*

          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config" "$HOME/.android"
          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=YlPorts,C=PA"
          fi

          python3 tools/prepare_android_mobile_68.py
          python3 tools/prepare_common_ui.py
          godot --headless --path . --import 2>&1 | tee /tmp/android-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android-import.log; then
            cat /tmp/android-import.log >&2
            exit 1
          fi

      - name: Export Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android/package
          godot --headless --verbose --path . \
            --export-debug "Android Mobile" \
            build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk
          test -s build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk
          cd build/android/package
          zip -9 ../SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-70.zip \
            SuperMarioWorldRemasteredPlus-Mobile.apk

      - name: Upload Android BUILD 70
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-android-arm64-build-70
          path: build/android/SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-70.zip
          if-no-files-found: error
          retention-days: 14
