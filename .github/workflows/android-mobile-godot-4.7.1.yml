name: Android Mobile - Godot 4.7.1

on:
  workflow_dispatch:
  push:
    branches:
      - windows-godot-4.7.1

concurrency:
  group: android-mobile-godot-4.7.1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  EXPORT_NAME: "SuperMarioWorldRemasteredPlus-Mobile"

jobs:
  build-android:
    name: Build Android arm64 APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout shared branch
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Configure Android mobile project
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates zip openjdk-17-jre-headless
          rm -rf /var/lib/apt/lists/*

          mkdir -p ~/.local/share/godot/export_templates ~/.config ~/.android
          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=YlPorts,C=PA"
          fi

          python3 tools/prepare_android_mobile.py
          python3 tools/prepare_common_ui.py
          test -s Assets/Fonts/PixelifySans.ttf
          grep -Fq 'MobileTouchControls="*res://Scripts/Autoload/mobile_touch_controls.gd"' project.godot
          grep -Fq 'FontFallbackManager="*res://Scripts/Autoload/font_fallback_manager.gd"' project.godot
          grep -Fq 'rom_checker_android_67.gd' rom_checker.tscn
          grep -Fq 'MobileSettings' Instances/UI/Menus/settings_menu.tscn
          grep -Fq 'name="Android Mobile"' export_presets.cfg

      - name: Import and validate Android project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/smw-android-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/smw-android-import.log; then
            cat /tmp/smw-android-import.log >&2
            exit 1
          fi

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --verbose --path . \
            --export-debug "Android Mobile" \
            "build/android/${EXPORT_NAME}.apk"
          test -s "build/android/${EXPORT_NAME}.apk"

      - name: Package Android build notes
        shell: bash
        run: |
          set -euo pipefail
          cat > build/android/README.txt <<'EOF'
          Super Mario World Remastered Plus - Android arm64 BUILD 67

          - English and Spanish selector only.
          - Minimal AÑADIR ROM button using Android's file picker.
          - Movable SNES-style touch buttons.
          - Size, opacity, enable/disable, move and reset options are integrated
            into Options > Touch Controls.
          EOF
          cd build/android
          zip -9 "../${EXPORT_NAME}-Android-arm64-BUILD-67.zip" \
            "${EXPORT_NAME}.apk" README.txt

      - name: Upload Android APK package
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-android-arm64-build-67-mobile
          path: build/${{ env.EXPORT_NAME }}-Android-arm64-BUILD-67.zip
          if-no-files-found: error
          retention-days: 14
