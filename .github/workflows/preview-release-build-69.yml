name: Preview BUILD 69 - PC and Android

on:
  workflow_dispatch:
  push:
    branches:
      - windows-godot-4.7.1

concurrency:
  group: preview-build-69-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WINDOWS_GODOT_VERSION: "4.7.1"
  ANDROID_GODOT_VERSION: "4.7.1"

jobs:
  windows:
    name: Windows x64 BUILD 69
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Prepare Windows
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates zip
          rm -rf /var/lib/apt/lists/*

          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi

          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${WINDOWS_GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${WINDOWS_GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          python3 tools/prepare_windows.py
          python3 tools/prepare_common_ui.py
          godot --headless --path . --import 2>&1 | tee /tmp/windows69-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/windows69-import.log; then
            cat /tmp/windows69-import.log >&2
            exit 1
          fi

      - name: Export Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows/languages
          godot --headless --path . \
            --export-release "Windows Desktop" \
            build/windows/SuperMarioWorldRemasteredPlus.exe
          test -s build/windows/SuperMarioWorldRemasteredPlus.exe
          test -s build/windows/SuperMarioWorldRemasteredPlus.pck

          for file in en.txt es.txt en_ui_fixes.txt es_ui_fixes.txt en_mobile.txt es_mobile.txt; do
            test -f "languages/$file"
            cp "languages/$file" build/windows/languages/
          done

          cat > build/windows/README.txt <<'EOF'
          Super Mario World Remastered Plus - Windows BUILD 69
          Selector fijo: English / Español.
          Fuente pixel compatible con Ñ y vocales acentuadas.
          EOF

          cd build/windows
          zip -9 -r ../SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-69.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-69-fixed
          path: build/SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-69.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 BUILD 69
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout shared BUILD 69 source
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Prepare Android with Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates zip openjdk-17-jdk-headless
          rm -rf /var/lib/apt/lists/*

          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config" "$HOME/.android"
          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi

          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${ANDROID_GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${ANDROID_GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=YlPorts,C=PA"
          fi

          python3 tools/prepare_android_mobile_68.py
          python3 tools/prepare_common_ui.py

          godot --headless --path . --import 2>&1 | tee /tmp/android69-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android69-import.log; then
            cat /tmp/android69-import.log >&2
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android/package
          godot --headless --verbose --path . \
            --export-debug "Android Mobile" \
            build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk
          test -s build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk

          cat > build/android/package/README.txt <<'EOF'
          Super Mario World Remastered Plus - Android arm64 BUILD 69
          Godot 4.7.1.
          Selector fijo: English / Español.
          Botón único AÑADIR ROM.
          Controles táctiles estilo SNES configurables y movibles.
          EOF

          cd build/android/package
          zip -9 ../SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-69.zip \
            SuperMarioWorldRemasteredPlus-Mobile.apk README.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build-69-godot-4.7.1
          path: build/android/SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-69.zip
          if-no-files-found: error
          retention-days: 14
