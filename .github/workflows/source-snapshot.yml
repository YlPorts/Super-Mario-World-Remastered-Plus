name: Source Snapshot

on:
  push:
    branches:
      - android-rom-ultrawide
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smw-source-snapshot
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
