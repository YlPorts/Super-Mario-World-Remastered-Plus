name: PC and Android - Godot 4.7.1

on:
  workflow_dispatch:
  push:
    branches:
      - windows-godot-4.7.1
  pull_request:
    branches:
      - main

concurrency:
  group: pc-android-godot-4.7.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_TEMPLATE_DIR: "4.7.1.stable"
  GODOT_LINUX_ZIP: "Godot_v4.7.1-stable_linux.x86_64.zip"
  GODOT_LINUX_BIN: "Godot_v4.7.1-stable_linux.x86_64"
  GODOT_TEMPLATES_TPZ: "Godot_v4.7.1-stable_export_templates.tpz"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout shared branch
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Install official Godot 4.7.1 and templates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl python3 unzip zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "/tmp/${GODOT_LINUX_ZIP}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/${GODOT_LINUX_ZIP}"
          rm -rf /tmp/godot-bin
          mkdir -p /tmp/godot-bin
          unzip -q "/tmp/${GODOT_LINUX_ZIP}" -d /tmp/godot-bin
          sudo install -m 0755 "/tmp/godot-bin/${GODOT_LINUX_BIN}" /usr/local/bin/godot

          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "/tmp/${GODOT_TEMPLATES_TPZ}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/${GODOT_TEMPLATES_TPZ}"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q "/tmp/${GODOT_TEMPLATES_TPZ}" -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

          godot --version | tee /tmp/godot-version.txt
          grep -Eq '^4\.7\.1\.stable' /tmp/godot-version.txt
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/windows_release_x86_64.exe"

      - name: Configure bilingual Windows project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_windows.py
          python3 tools/prepare_common_ui.py
          test -s Assets/Fonts/PixelifySans.ttf
          grep -Fq 'FontFallbackManager="*res://Scripts/Autoload/font_fallback_manager.gd"' project.godot
          grep -Fq 'language_settings_fixed.gd' Instances/UI/language_settings.tscn
          ! grep -Eq '^(PortManager|TouchControls|TouchControlsRefresh|MobileTouchControls)=' project.godot
          ! grep -Fq 'WINDOW_MODE_EXCLUSIVE_FULLSCREEN' Scripts/Autoload/SettingsManager.gd

      - name: Import and validate Windows project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/windows-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/windows-import.log; then
            cat /tmp/windows-import.log >&2
            exit 1
          fi

      - name: Run Windows startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/smw-windows-startup.log
          grep -Fq '[WIN58] ROM CHECKER READY' /tmp/smw-windows-startup.log
          grep -Fq '[WIN60] BOSS CAMERA READY' /tmp/smw-windows-startup.log
          grep -Fq '[FONT67] LATIN PIXEL FALLBACK READY' /tmp/smw-windows-startup.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/smw-windows-startup.log; then
            cat /tmp/smw-windows-startup.log >&2
            exit 1
          fi

      - name: Export Windows x64 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --verbose --path . \
            --export-release "Windows Desktop" \
            "build/windows/SuperMarioWorldRemasteredPlus.exe"
          test -s build/windows/SuperMarioWorldRemasteredPlus.exe
          test -s build/windows/SuperMarioWorldRemasteredPlus.pck

      - name: Package Windows BUILD 70
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/windows/languages
          mkdir -p build/windows/languages
          cp languages/en.txt languages/es.txt \
             languages/en_ui_fixes.txt languages/es_ui_fixes.txt \
             languages/en_mobile.txt languages/es_mobile.txt \
             build/windows/languages/
          cat > build/windows/README.txt <<'EOF'
          Super Mario World Remastered Plus - Windows x64 BUILD 70
          Compilado con Godot 4.7.1 estable.
          Idiomas seleccionables: English y Español.
          EOF
          cd build/windows
          zip -9 -r ../SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-70.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-windows-x64-build-70
          path: build/SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-70.zip
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout shared branch
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install official Godot 4.7.1 and templates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl python3 unzip zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "/tmp/${GODOT_LINUX_ZIP}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/${GODOT_LINUX_ZIP}"
          rm -rf /tmp/godot-bin
          mkdir -p /tmp/godot-bin
          unzip -q "/tmp/${GODOT_LINUX_ZIP}" -d /tmp/godot-bin
          sudo install -m 0755 "/tmp/godot-bin/${GODOT_LINUX_BIN}" /usr/local/bin/godot

          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -o "/tmp/${GODOT_TEMPLATES_TPZ}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/${GODOT_TEMPLATES_TPZ}"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q "/tmp/${GODOT_TEMPLATES_TPZ}" -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

          godot --version | tee /tmp/godot-version.txt
          grep -Eq '^4\.7\.1\.stable' /tmp/godot-version.txt
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_debug.apk"

      - name: Configure Android export tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=YlPorts,C=PA"
          fi

      - name: Configure Android mobile project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_android_mobile_68.py
          python3 tools/prepare_common_ui.py
          test -s Assets/Fonts/PixelifySans.ttf
          grep -Fq 'mobile_touch_controls_68.gd' project.godot
          grep -Fq 'rom_checker_android_67.gd' rom_checker.tscn
          grep -Fq 'MobileSettings' Instances/UI/Menus/settings_menu.tscn
          grep -Fq 'name="Android Mobile"' export_presets.cfg

      - name: Import and validate Android project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/android-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android-import.log; then
            cat /tmp/android-import.log >&2
            exit 1
          fi

      - name: Run Android startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/smw-android-startup.log
          grep -Fq '[ANDROID67] MINIMAL ROM PICKER READY' /tmp/smw-android-startup.log
          grep -Fq '[MOBILE68] SNES TOUCH CONTROLS READY' /tmp/smw-android-startup.log
          grep -Fq '[FONT67] LATIN PIXEL FALLBACK READY' /tmp/smw-android-startup.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/smw-android-startup.log; then
            cat /tmp/smw-android-startup.log >&2
            exit 1
          fi

      - name: Export Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android/package
          godot --headless --verbose --path . \
            --export-debug "Android Mobile" \
            build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk
          test -s build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk

      - name: Package Android BUILD 70
        shell: bash
        run: |
          set -euo pipefail
          cat > build/android/package/README.txt <<'EOF'
          Super Mario World Remastered Plus - Android ARM64 BUILD 70
          Compilado con Godot 4.7.1 estable.
          Incluye selector AÑADIR ROM y controles táctiles SNES configurables.
          EOF
          cd build/android/package
          zip -9 ../SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-70.zip \
            SuperMarioWorldRemasteredPlus-Mobile.apk README.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-android-arm64-build-70
          path: build/android/SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-70.zip
          if-no-files-found: error
          retention-days: 14
