name: Windows x64 - Godot 4.7.1

on:
  workflow_dispatch:
  push:
    branches:
      - windows-godot-4.7.1
  pull_request:
    branches:
      - main

concurrency:
  group: windows-godot-4.7.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  EXPORT_NAME: "SuperMarioWorldRemasteredPlus"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Configure bilingual Windows project
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates zip
          rm -rf /var/lib/apt/lists/*

          mkdir -p ~/.local/share/godot/export_templates ~/.config
          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          python3 tools/prepare_windows.py
          python3 tools/prepare_common_ui.py
          test -s Assets/Fonts/PixelifySans.ttf
          grep -Fq 'FontFallbackManager="*res://Scripts/Autoload/font_fallback_manager.gd"' project.godot
          grep -Fq 'language_settings_fixed.gd' Instances/UI/language_settings.tscn
          ! grep -Eq '^(PortManager|TouchControls|TouchControlsRefresh|MobileTouchControls)=' project.godot
          ! grep -Fq 'WINDOW_MODE_EXCLUSIVE_FULLSCREEN' Scripts/Autoload/SettingsManager.gd

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import

      - name: Run Windows startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/smw-windows-startup.log
          grep -Fq '[WIN58] ROM CHECKER READY' /tmp/smw-windows-startup.log
          grep -Fq '[WIN60] BOSS CAMERA READY' /tmp/smw-windows-startup.log
          grep -Fq '[FONT67] LATIN PIXEL FALLBACK READY' /tmp/smw-windows-startup.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/smw-windows-startup.log; then
            cat /tmp/smw-windows-startup.log >&2
            exit 1
          fi

      - name: Export Windows x64 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --verbose --path . \
            --export-release "Windows Desktop" \
            "build/windows/${EXPORT_NAME}.exe"
          test -s "build/windows/${EXPORT_NAME}.exe"
          test -s "build/windows/${EXPORT_NAME}.pck"

      - name: Package portable Windows build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/windows/languages
          mkdir -p build/windows/languages
          cp languages/en.txt languages/es.txt \
             languages/en_ui_fixes.txt languages/es_ui_fixes.txt \
             languages/en_mobile.txt languages/es_mobile.txt \
             build/windows/languages/
          cat > build/windows/README.txt <<'EOF'
          Super Mario World Remastered Plus - Windows x64 BUILD 67
          Built with Godot 4.7.1.

          Run SuperMarioWorldRemasteredPlus.exe.
          English and Spanish are the two included selectable languages.
          The language selector uses a matching pixel font with Ñ and accented
          Spanish characters while retaining the original bitmap UI fonts.
          EOF
          cd build/windows
          zip -9 -r "../${EXPORT_NAME}-Windows-x64-BUILD-67-Bilingual.zip" .

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-windows-x64-build-67-bilingual
          path: build/${{ env.EXPORT_NAME }}-Windows-x64-BUILD-67-Bilingual.zip
          if-no-files-found: error
          retention-days: 14
