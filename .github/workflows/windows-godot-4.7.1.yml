name: Windows x64 - Godot 4.7.1

on:
  workflow_dispatch:
  push:
    branches:
      - windows-godot-4.7.1
  pull_request:
    branches:
      - main

concurrency:
  group: windows-godot-4.7.1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  EXPORT_NAME: "SuperMarioWorldRemasteredPlus"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Configure safe Godot 4.7.1 desktop project
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 zip
          rm -rf /var/lib/apt/lists/*

          mkdir -p ~/.local/share/godot/export_templates ~/.config

          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi

          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          python3 tools/prepare_windows.py
          grep -Fq 'config/features=PackedStringArray("4.7")' project.godot
          grep -Fq 'config/custom_user_dir_name="SuperMarioWorldRemastered-Windows-4.7.1"' project.godot
          grep -Fq 'window/size/mode=0' project.godot
          grep -Fq 'window/size/window_width_override=1280' project.godot
          grep -Fq 'window/size/window_height_override=720' project.godot
          grep -Fq 'window/stretch/mode="canvas_items"' project.godot
          grep -Fq 'window/stretch/aspect="expand"' project.godot
          grep -Fq 'BossArenaCamera="*res://Scripts/Autoload/boss_arena_camera.gd"' project.godot
          ! grep -Eq '^(PortManager|TouchControls|TouchControlsRefresh)=' project.godot
          ! grep -Fq 'AndroidSettings' Instances/UI/Menus/settings_menu.tscn
          ! grep -Fq 'WINDOW_MODE_EXCLUSIVE_FULLSCREEN' Scripts/Autoload/SettingsManager.gd
          grep -Fq 'START_CAPTURE_KEYS' Scripts/UI/keyboard_settings.gd
          grep -Fq 'Window.CONTENT_SCALE_ASPECT_KEEP' Scripts/LevelElements/auto_scroll.gd
          grep -Fq '[AUTOSCROLL61] SAFE 16:9 FRAME ENABLED' Scripts/LevelElements/auto_scroll.gd
          grep -Fq 'visible = false' rom_checker.tscn

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import

      - name: Run Windows startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 6 2>&1 | tee /tmp/smw-windows-startup.log
          grep -Fq '[WIN58] ROM CHECKER READY' /tmp/smw-windows-startup.log || {
            echo 'Windows ROM selector did not reach _ready().' >&2
            cat /tmp/smw-windows-startup.log >&2
            exit 1
          }
          grep -Fq '[WIN60] BOSS CAMERA READY' /tmp/smw-windows-startup.log || {
            echo 'Boss arena camera service did not reach _ready().' >&2
            cat /tmp/smw-windows-startup.log >&2
            exit 1
          }
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/smw-windows-startup.log; then
            echo 'A startup script error was detected.' >&2
            cat /tmp/smw-windows-startup.log >&2
            exit 1
          fi

      - name: Export Windows x64 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --verbose --path . \
            --export-release "Windows Desktop" \
            "build/windows/${EXPORT_NAME}.exe"
          test -s "build/windows/${EXPORT_NAME}.exe"
          test -s "build/windows/${EXPORT_NAME}.pck"

      - name: Package portable Windows build
        shell: bash
        run: |
          set -euo pipefail
          cat > build/windows/README.txt <<'EOF'
          Super Mario World Remastered Plus - Windows x64 BUILD 61
          Built with Godot 4.7.1.

          Run SuperMarioWorldRemasteredPlus.exe.
          It starts centered in a 1280x720 resizable window.
          On first launch, click SELECT ROM and choose your legal .sfc/.smc dump.
          Normal levels expand horizontally on widescreen and ultrawide displays.
          Auto-scroll levels temporarily use a centered 16:9 safe frame so their
          moving walls, enemy activation and obstacle timing remain original.
          Android-only options and touch controls are removed from this build.
          Options > Controls supports keyboard reassignment, including Z.
          Fixed-size boss arenas are centered on widescreen displays.
          EOF
          cd build/windows
          zip -9 -r "../${EXPORT_NAME}-Windows-x64-BUILD-61.zip" .

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-windows-x64-build-61
          path: build/${{ env.EXPORT_NAME }}-Windows-x64-BUILD-61.zip
          if-no-files-found: error
          retention-days: 14
