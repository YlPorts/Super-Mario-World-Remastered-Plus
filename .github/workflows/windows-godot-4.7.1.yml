name: BUILD 70 - PC and Android - Godot 4.7.1

on:
  workflow_dispatch:
  push:
    branches:
      - windows-godot-4.7.1
  pull_request:
    branches:
      - main

concurrency:
  group: build-70-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_TEMPLATE_DIR: "4.7.1.stable"
  GODOT_LINUX_ZIP: "Godot_v4.7.1-stable_linux.x86_64.zip"
  GODOT_TEMPLATES_TPZ: "Godot_v4.7.1-stable_export_templates.tpz"
  GODOT_BASE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable"

jobs:
  windows:
    name: Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl python3 unzip zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "$GODOT_BASE_URL/$GODOT_LINUX_ZIP"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/templates.tpz "$GODOT_BASE_URL/$GODOT_TEMPLATES_TPZ"
          rm -rf /tmp/godot-bin /tmp/godot-templates
          mkdir -p /tmp/godot-bin /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/"
          godot --version | tee /tmp/windows-version.log
          grep -Eq '^4\.7\.1\.stable' /tmp/windows-version.log
          test -s "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/windows_release_x86_64.exe"

      - name: Prepare Windows
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_windows.py
          python3 tools/prepare_common_ui.py
          grep -Fq 'config/features=PackedStringArray("4.7")' project.godot
          ! grep -Eq '^(PortManager|TouchControls|TouchControlsRefresh|MobileTouchControls)=' project.godot

      - name: Import Windows
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/windows-import.log
          ! grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/windows-import.log

      - name: Start Windows
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/windows-startup.log
          ! grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/windows-startup.log

      - name: Export Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --verbose --path . --export-release "Windows Desktop" build/windows/SuperMarioWorldRemasteredPlus.exe 2>&1 | tee /tmp/windows-export.log
          test -s build/windows/SuperMarioWorldRemasteredPlus.exe
          test -s build/windows/SuperMarioWorldRemasteredPlus.pck
          cat > build/windows/README.txt <<'EOF'
          Super Mario World Remastered Plus - Windows x64 BUILD 70
          Godot 4.7.1 stable. ROM not included.
          EOF
          cd build/windows
          zip -9 -r ../SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-70.zip .

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-windows-x64-build-70
          path: build/SuperMarioWorldRemasteredPlus-Windows-x64-BUILD-70.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-70-logs
          path: /tmp/windows-*.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl python3 unzip zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "$GODOT_BASE_URL/$GODOT_LINUX_ZIP"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/templates.tpz "$GODOT_BASE_URL/$GODOT_TEMPLATES_TPZ"
          rm -rf /tmp/godot-bin /tmp/godot-templates
          mkdir -p /tmp/godot-bin /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          GODOT_BIN="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/"
          godot --version | tee /tmp/android-version.log
          grep -Eq '^4\.7\.1\.stable' /tmp/android-version.log
          test -s "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/android_debug.apk"

      - name: Configure Android exporter
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=YlPorts,C=PA"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Prepare Android
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_android_mobile_68.py
          python3 tools/prepare_common_ui.py
          grep -Fq 'config/features=PackedStringArray("4.7")' project.godot
          grep -Fq 'mobile_touch_controls_68.gd' project.godot
          grep -Fq 'rom_checker_android_67.gd' rom_checker.tscn
          grep -Fq 'var radius: float = minf(size.x, size.y) * 0.42' Scripts/UI/mobile_touch_button_68.gd
          grep -Fq 'version/code=70' export_presets.cfg
          grep -Fq 'name="Android Mobile"' export_presets.cfg

      - name: Import Android
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/android-import.log
          ! grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android-import.log

      - name: Start Android
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/android-startup.log
          ! grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android-startup.log

      - name: Export Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android/package
          godot --headless --verbose --path . --export-debug "Android Mobile" build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk 2>&1 | tee /tmp/android-export.log
          test -s build/android/package/SuperMarioWorldRemasteredPlus-Mobile.apk
          cat > build/android/package/README.txt <<'EOF'
          Super Mario World Remastered Plus - Android ARM64 BUILD 70
          Godot 4.7.1 stable. ROM not included.
          EOF
          cd build/android/package
          zip -9 ../SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-70.zip SuperMarioWorldRemasteredPlus-Mobile.apk README.txt

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-android-arm64-build-70
          path: build/android/SuperMarioWorldRemasteredPlus-Android-arm64-BUILD-70.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-70-logs
          path: /tmp/android-*.log
          if-no-files-found: ignore
          retention-days: 7
