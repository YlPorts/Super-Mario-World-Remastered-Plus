name: Android Mobile BUILD 68

on:
  workflow_dispatch:
  push:
    branches:
      - windows-godot-4.7.1

concurrency:
  group: android-mobile-build-68-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  EXPORT_NAME: "SuperMarioWorldRemasteredPlus-Mobile"

jobs:
  build-android:
    name: Build Android arm64 APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout shared branch
        uses: actions/checkout@v4
        with:
          ref: windows-godot-4.7.1
          lfs: true

      - name: Configure Android BUILD 68
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates zip openjdk-17-jdk-headless
          rm -rf /var/lib/apt/lists/*
          mkdir -p ~/.local/share/godot/export_templates ~/.config ~/.android

          CONFIG_SOURCE="/root/.config/godot"
          CONFIG_TARGET="$HOME/.config/godot"
          if [ -d "$CONFIG_SOURCE" ] && [ "$CONFIG_SOURCE" != "$CONFIG_TARGET" ]; then
            rm -rf "$CONFIG_TARGET"
            mv "$CONFIG_SOURCE" "$CONFIG_TARGET"
          fi
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            mv "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=YlPorts,C=PA"
          fi

          python3 tools/prepare_android_mobile_68.py
          python3 tools/prepare_common_ui.py
          test -s Assets/Fonts/PixelifySans.ttf
          grep -Fq 'mobile_touch_controls_68.gd' project.godot
          grep -Fq 'rom_checker_android_67.gd' rom_checker.tscn
          grep -Fq 'MobileSettings' Instances/UI/Menus/settings_menu.tscn

      - name: Import and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/android68-import.log
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/android68-import.log; then
            cat /tmp/android68-import.log >&2
            exit 1
          fi

      - name: Export installable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --verbose --path . \
            --export-debug "Android Mobile" \
            "build/android/${EXPORT_NAME}.apk"
          test -s "build/android/${EXPORT_NAME}.apk"

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          cat > build/android/README.txt <<'EOF'
          Super Mario World Remastered Plus - Android arm64 BUILD 68

          Idiomas: English y Español.
          ROM: botón único AÑADIR ROM.
          Controles: estilo SNES, movibles y configurables desde Opciones.
          Ajustes: activar, tamaño, opacidad, mover y restablecer.
          EOF
          cd build/android
          zip -9 "../${EXPORT_NAME}-Android-arm64-BUILD-68.zip" \
            "${EXPORT_NAME}.apk" README.txt

      - name: Upload Android BUILD 68
        uses: actions/upload-artifact@v4
        with:
          name: smw-remastered-plus-android-arm64-build-68
          path: build/${{ env.EXPORT_NAME }}-Android-arm64-BUILD-68.zip
          if-no-files-found: error
          retention-days: 14
